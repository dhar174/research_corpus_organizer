[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pdf-research-corpus"
version = "1.0.0"
description = "A comprehensive system for processing and organizing academic PDF research papers using LangGraph, GPT-5, and RAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Research Corpus Organizer", email = "noreply@example.com"}
]
maintainers = [
    {name = "Research Corpus Organizer", email = "noreply@example.com"}
]
keywords = [
    "research",
    "pdf",
    "rag",
    "retrieval-augmented-generation",
    "langgraph",
    "gpt",
    "openai",
    "academic",
    "papers",
    "corpus",
    "taxonomy",
    "classification",
    "summarization",
    "faiss",
    "embeddings",
    "nlp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "pymupdf>=1.23.0",
    "openai>=1.3.0",
    "langgraph>=0.0.30",
    "langchain>=0.1.0",
    "faiss-cpu>=1.7.4",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
clustering = [
    "hdbscan>=0.8.33",
]
visualization = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
all = [
    "rag-pdf-research-corpus[ocr]",
    "rag-pdf-research-corpus[clustering]",
    "rag-pdf-research-corpus[visualization]",
]
full = [
    "rag-pdf-research-corpus[all]",
    "rag-pdf-research-corpus[dev]",
]

[project.urls]
Homepage = "https://github.com/dhar174/research_corpus_organizer"
Documentation = "https://github.com/dhar174/research_corpus_organizer/blob/main/USER_GUIDE.md"
Repository = "https://github.com/dhar174/research_corpus_organizer"
"Bug Tracker" = "https://github.com/dhar174/research_corpus_organizer/issues"
Changelog = "https://github.com/dhar174/research_corpus_organizer/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = [
    "rag_models",
    "drive_utils",
    "pdf_parser",
    "metadata_extractor",
    "embedding_generator",
    "summarization_pass1",
    "topic_taxonomy",
    "paper_classification",
    "export_manager",
    "workflow_orchestrator",
    "quality_control",
    "rag_query_interface",
    "corpus_utilities",
    "taxonomy_review",
    "deep_analysis_pass2",
    "advanced_visualizations",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
